<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#ffffff" rx="4"/>
  <!-- Earnings axis (x) -->
  <line x1="4" y1="26" x2="28" y2="26" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Net-income axis (y) -->
  <line x1="4" y1="26" x2="4" y2="4" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Income curve: rises gradually then drops off a cliff -->
  <polyline
    points="4,22 8,19 12,16 15,13.5 17,13.5 17,21 20,21 24,20 28,19.5"
    fill="none"
    stroke="#2C6496"
    stroke-width="2.2"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Cliff marker dot -->
  <circle cx="17" cy="13.5" r="1.8" fill="#2C6496"/>
</svg>
